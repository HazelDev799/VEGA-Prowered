<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEGA Games</title>
    <style>
        /* Reset defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d1d5db;
            /* Subtle grid/wave pattern background approximation */
            background-image: radial-gradient(rgba(255,255,255,0.5) 1px, transparent 0);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Navigation Bar */
        header {
            width: 100%;
            background: linear-gradient(to bottom, #111111, #222222);
            color: white;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .left-nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Logo styling */
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            font-style: italic;
        }

        /* Search input bar */
        .search-bar {
            background-color: white;
            border: none;
            border-radius: 20px;
            padding: 6px 15px;
            width: 180px;
            font-size: 14px;
            outline: none;
        }

        /* Navigation Links */
        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: #cccccc;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffffff;
            font-weight: bold;
        }

        /* Right side contact information */
        .contact-info {
            text-align: right;
            font-size: 12px;
            color: #bbbbbb;
            line-height: 1.5;
        }

        .contact-info strong {
            color: white;
        }

        /* Main Content Container (Blue Card) */
        .main-container {
            width: 90%;
            max-width: 1100px;
            background-color: #00bfff;
            margin-top: 50px;
            border-radius: 12px;
            min-height: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            color: white;
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="left-nav">
            <div class="logo">VEGA™</div>
            <input type="text" class="search-bar" placeholder="🔍 Search">
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#" class="active">Games</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About us</a></li>
                </ul>
            </nav>
        </div>
        
        <div class="contact-info">
            <div>Phone: <strong>+976 9523-4925</strong></div>
            <div>Email: <strong>info@vegaprowered.com</strong></div>
        </div>
    </header>

    <!-- Main Games Content Section -->
    <div class="main-container">
        <h2 class="section-title">GAMES</h2>
        <!-- Future game grid items can be placed here inside this blue container -->
    </div>

</body>
</html>
